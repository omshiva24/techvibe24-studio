<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:Yatra;src:url(../fonts/YatraOne-Regular.ttf)}
@font-face{font-family:Brico;src:url(../fonts/Bricolage.ttf);font-weight:200 800}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#1a0800}
.bg{position:absolute;inset:-40px;background:url(frame.jpg) center 35%/cover;filter:blur(26px) brightness(.55) saturate(1.3)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,10,0,.92) 0%,rgba(60,15,0,.75) 45%,rgba(0,0,0,0) 75%)}
.card{position:absolute;right:70px;top:-10px;height:740px;width:416px;background:url(frame.jpg) center 30%/cover;border-left:6px solid #ffc94a;border-right:6px solid #ffc94a;box-shadow:0 0 60px rgba(255,170,40,.75)}
.t{position:absolute;left:64px;top:118px;width:720px}
.sh{font-family:Yatra;font-size:64px;color:#ffe9b0;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.h{font-family:Yatra;font-size:150px;line-height:1.05;margin-top:6px;background:linear-gradient(180deg,#fff3c4 0%,#ffc23a 55%,#ff7a00 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 14px rgba(0,0,0,.65))}
.sub{font-family:Brico;font-weight:800;font-size:44px;color:#fff;margin-top:22px;letter-spacing:.5px;text-shadow:0 3px 12px rgba(0,0,0,.7)}
.sub b{color:#ffc94a}
.pill{display:inline-block;margin-top:30px;font-family:Brico;font-weight:700;font-size:30px;color:#2a0d00;background:#ffc94a;border-radius:40px;padding:10px 26px}
</style></head><body><div class=bg></div><div class=shade></div><div class=card></div>
<div class=t><div class=sh>श्री</div><div class=h>हनुमान<br>चालीसा</div><div class=sub>Full <b>Movie Style</b> + Lyrics</div><div class=pill>@TECHVIBE24</div></div>
</body></html>
