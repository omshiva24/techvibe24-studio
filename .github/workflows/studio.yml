    if: always() && contains(github.event.head_commit.message, '[mftts]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'mfvo-*', path: parts }
      - name: merge and publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=en-US-AndrewMultilingualNeural; mkdir -p mftts/$V
